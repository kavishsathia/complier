name: cli-release

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build a universal binary
        working-directory: cli
        run: |
          cargo test
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output complier \
            target/aarch64-apple-darwin/release/complier \
            target/x86_64-apple-darwin/release/complier
          tar -czf complier-macos-universal.tar.gz complier
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cli/complier-macos-universal.tar.gz \
            --title "complier CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes
