# Claude Code's own tools, as the pre-commit gate's actions. Running the check counts as `check`, and
# its result is `done` if it passed (exit code 0) and `failed` if not.
service: ../../packages/claude-code/service.yaml
translate:
  tools: [Bash, Edit, Write]
  schema:
    command: optional<string>
  assumption: "tool == 'Bash' ? command.hasValue() : true"
  rules:
    edit:  { when: "tool == 'Edit' || tool == 'Write'", emit: edit }
    check: { when: "tool == 'Bash' && command.value() == 'python3 check.py'", emit: check }
    commit:
      when: >-
        tool == 'Bash' && command.value().startsWith('git commit')
        && !command.value().contains('&') && !command.value().contains(';') && !command.value().contains('|')
      emit: commit
  results:
    default: "ok ? 'done' : 'failed'"
hidden: [Read, LSP, ToolSearch]
