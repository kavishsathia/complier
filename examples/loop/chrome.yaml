# Claude in Chrome: every tool call is browsing.
service: ../../packages/claude-in-chrome/service.yaml
translate:
  tools: [tabs_context_mcp, tabs_create_mcp, tabs_close_mcp, navigate, computer, read_page, find, form_input,
          get_page_text, javascript_tool, read_console_messages, read_network_requests, resize_window,
          gif_creator, shortcuts_execute, list_connected_browsers, select_browser, switch_browser, browser_batch]
  rules:
    browse: { when: "true", emit: browse }
  results:
    default: "ok ? 'done' : 'failed'"
