# Claude Code's own tools, as the workflow's actions.
service: ../../packages/claude-code/service.yaml
translate:
  tools: [Bash, Edit, Write, Monitor, PushNotification]
  schema:
    command: optional<string>
  assumption: "tool == 'Bash' ? command.hasValue() : true"
  rules:
    check_time: { when: "tool == 'Bash' && command.value() == 'date +%s'", emit: check_time }
    edit:       { when: "tool == 'Edit' || tool == 'Write'", emit: edit }
    commit:
      when: >-
        tool == 'Bash' && command.value().startsWith('git commit')
        && !command.value().contains('&') && !command.value().contains(';') && !command.value().contains('|')
      emit: commit
    push:
      when: >-
        tool == 'Bash' && command.value().startsWith('git push')
        && !command.value().contains('&') && !command.value().contains(';') && !command.value().contains('|')
      emit: push
    monitor:    { when: "tool == 'Monitor'", emit: monitor }
    notify:     { when: "tool == 'PushNotification'", emit: notify }
  results:
    check_time: >-
      ok && output.trim().matches('^[0-9]+$') ? 'minutes.' + string((int(output.trim()) / 60) % 120) : 'failed'
    default: "ok ? 'done' : 'failed'"
hidden: [Read, LSP, ToolSearch, ListAgents, TaskStop]
