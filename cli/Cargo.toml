[package]
name = "complier"
version = "0.1.0"
edition = "2021"
description = "Enforce CSP contracts on Claude Code through hooks and a per-user daemon."
license = "MIT"

[[bin]]
name = "complier"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
