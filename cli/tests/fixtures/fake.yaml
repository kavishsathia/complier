# The end-to-end test's unit, over fake-server.mjs: CEL rules for the agent's writes, a hidden
# read, and a translated tool whose schema has drifted since fake/tools.yaml was generated.
service: fake/service.yaml
translate:
  tools: [write-item, wipe, stale]
  schema:
    id: optional<string>
    mode: optional<string>
  assumption: tool != 'write-item' || id.hasValue()
  rules:
    append:
      when: tool == 'write-item' && mode.orValue('append') == 'append'
      emit: appended
      value: id.value()
    replace:
      when: tool == 'write-item' && mode.orValue('') == 'replace'
      emit: replaced
      value: id.value()
  fallback:
    emit: other
    value: tool
hidden: [peek]
