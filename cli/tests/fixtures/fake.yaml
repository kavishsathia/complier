# The end-to-end test's unit, over the fake service: CEL rules for the agent's writes and a
# hidden read.
service: fake/service.yaml
translate:
  tools: [write-item, wipe, stale]
  schema:
    id: optional<string>
    mode: optional<string>
  assumption: tool != 'write-item' || id.hasValue()
  rules:
    append:
      when: tool == 'write-item' && mode.orValue('append') == 'append'
      emit: appended
      value: id.value()
    replace:
      when: tool == 'write-item' && mode.orValue('') == 'replace'
      emit: replaced
      value: id.value()
  fallback:
    emit: other
    value: tool
  results:
    default: "ok ? 'done' : 'failed'"
hidden: [peek]
