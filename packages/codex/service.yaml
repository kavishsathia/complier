# Codex's own (built-in) tools, which units name with `service:` like any MCP server's. A machine
# with a unit for this service checks a Codex agent's built-in tools through the same hook as MCP
# tools, and blocks any built-in tool its units don't name. (Claude Code's are the service
# claude-code: each agent's built-in tools are checked by the unit for its own harness.)
# readOnly: tools reviewed as having no effect outside the conversation, so units may hide them.
name: codex
tools: tools.yaml
readOnly: [view_image, tool_search, update_plan, list_agents, list_mcp_resources, list_mcp_resource_templates, read_mcp_resource]
