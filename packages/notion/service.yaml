# Reviewed metadata for the Notion MCP server, which units name with `service:`.
# name: the server's name, both in Claude Code (whose tools are then mcp__notion__<tool>) and as
#   registered with `complier add notion --url https://mcp.notion.com/mcp` for `complier gen`.
# tools: every tool and its input schema hash, from `complier gen notion`; units may only name
#   these tools.
# readOnly: the tools reviewed as side-effect free. Only these can be hidden (passed upstream
#   unchecked).
name: notion
tools: tools.yaml
readOnly:
  - notion-fetch
  - notion-search
  - notion-get-comments
  - notion-get-users
  - notion-get-self
  - notion-get-teams
  - notion-list-private-pages
  - notion-list-shared-pages
  - notion-list-favorite-pages
  - notion-list-recent-pages
